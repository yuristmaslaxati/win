<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Qurilma nomi</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 360px;
    padding: 28px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    box-sizing: border-box;
  }
  h1 {
    font-size: 17px;
    margin: 0 0 16px;
    color: #1d1d1f;
    text-align: center;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #d2d2d7;
    border-radius: 8px;
    outline: none;
  }
  input:focus {
    border-color: #0071e3;
  }
  .hint {
    margin-top: 8px;
    font-size: 12px;
    color: #86868b;
  }
  .error {
    margin-top: 8px;
    font-size: 12px;
    color: #d70015;
    display: none;
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px 12px;
    font-size: 14px;
    font-weight: 600;
    color: #ffffff;
    background: #0071e3;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  button:disabled {
    background: #a9d1f7;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Bu kompyuter kimga tegishli?</h1>
    <input id="deviceName" type="text" autofocus maxlength="80" placeholder="Masalan: Mahmud PC, Kassa-01">
    <div class="hint">Masalan: Mahmud PC, Shuhrat PC, Kassa-01</div>
    <div class="error" id="error">Iltimos, nom kiriting.</div>
    <button id="save">Saqlash</button>
  </div>
  <script>
    (function () {
      var input = document.getElementById("deviceName");
      var button = document.getElementById("save");
      var error = document.getElementById("error");

      function submit() {
        var value = input.value.trim();
        if (!value) {
          error.style.display = "block";
          input.focus();
          return;
        }
        error.style.display = "none";
        button.disabled = true;
        input.disabled = true;
        window.location.href = "pake-device-name:set?name=" + encodeURIComponent(value);
      }

      button.addEventListener("click", submit);
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          submit();
        }
      });
    })();
  </script>
</body>
</html>
